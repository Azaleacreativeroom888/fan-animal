<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギャラリー | どうぶつ勉強ノート</title>
<meta name="description" content="動物をテーマにしたイラスト、漫画、4コマ、軽い読みものを集めたギャラリー。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#8b008b;
  --purple-deep:#4d004d;
  --purple-soft:#f7ecf7;
  --purple-line:#e2c3e2;
  --yellow:#ffd21f;
  --ink:#2b1030;
  --paper:#fffafd;
  --display:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.85}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.wrap{width:min(1040px,100% - 40px);margin-inline:auto}

/* header */
header{background:var(--purple-deep);color:#fff}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding:14px 0}
.logo{font-family:var(--display);font-size:1.15rem;text-decoration:none;letter-spacing:.04em}
.logo span{color:var(--yellow)}
nav ul{display:flex;flex-wrap:wrap;gap:4px 8px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:6px 14px;border-radius:999px;text-decoration:none;font-weight:700;font-size:.95rem}
nav a:hover{background:rgba(255,255,255,.14)}
nav a[aria-current="page"]{background:var(--yellow);color:var(--purple-deep)}

/* page title */
.pagehead{background:var(--purple);color:#fff}
.pagehead .wrap{padding:48px 0 52px}
.pagehead h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,3.2rem);line-height:1.3;margin:0 0 8px;border-bottom:8px solid var(--yellow);display:inline-block}
.pagehead p{margin:14px 0 0;max-width:32em}

/* filter */
main{padding:40px 0 72px}
.filter{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 32px;padding:0;list-style:none}
.filter button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--purple);background:#fff;color:var(--purple);padding:4px 20px;border-radius:999px}
.filter button:hover{background:var(--purple-soft)}
.filter button[aria-pressed="true"]{background:var(--purple);color:#fff;box-shadow:0 0 0 3px var(--yellow)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;list-style:none;margin:0;padding:0}
.grid li[hidden]{display:none}
figure{margin:0;background:#fff;border:2px solid var(--purple);border-radius:20px;overflow:hidden}
figure:hover{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow)}
.pic{aspect-ratio:1;display:grid;place-content:center;text-align:center;padding:12px;background:var(--purple-soft);color:var(--purple);font-weight:700;border-bottom:2px solid var(--purple)}
.pic.tall{aspect-ratio:3/4}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{padding:12px 18px 16px;font-size:.92rem;line-height:1.6}
figcaption strong{display:block;font-size:1.02rem}
.tag{display:inline-block;background:var(--yellow);color:var(--purple-deep);font-size:.76rem;font-weight:700;padding:0 12px;border-radius:999px;margin-bottom:4px}
.note{margin-top:28px;font-size:.9rem;color:var(--purple)}

footer{background:var(--purple-deep);color:#fff;padding:32px 0;text-align:center;font-size:.9rem}
footer a{color:var(--yellow)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="index.html">どうぶつ<span>勉強</span>ノート</a>
    <nav aria-label="メインメニュー">
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="blog.html">ブログ</a></li>
        <li><a href="gallery.html" aria-current="page">ギャラリー</a></li>
        <li><a href="about.html">このサイトについて</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="pagehead">
  <div class="wrap">
    <h1>ギャラリー</h1>
    <p>動物をテーマに描いたイラスト、漫画、4コマと、小論文形式の軽い記事を並べています。</p>
  </div>
</div>

<main>
  <div class="wrap">
    <ul class="filter" aria-label="作品の絞り込み">
      <li><button type="button" data-cat="all" aria-pressed="true">すべて</button></li>
      <li><button type="button" data-cat="illust" aria-pressed="false">イラスト</button></li>
      <li><button type="button" data-cat="manga" aria-pressed="false">漫画</button></li>
      <li><button type="button" data-cat="yonkoma" aria-pressed="false">4コマ</button></li>
      <li><button type="button" data-cat="essay" aria-pressed="false">記事</button></li>
    </ul>

    <!-- 作品を足すときは、下の <li> をコピーして、.pic の中身を <img src="画像のパス" alt="作品の説明"> に置き換えてください -->
    <ul class="grid">
      <li data-cat="illust"><figure><div class="pic">イラストの<br>画像を置く場所</div><figcaption><span class="tag">イラスト</span><strong>作品のタイトル</strong>ひとことの説明が入ります。</figcaption></figure></li>
      <li data-cat="yonkoma"><figure><div class="pic tall">4コマの<br>画像を置く場所</div><figcaption><span class="tag">4コマ</span><strong>作品のタイトル</strong>ひとことの説明が入ります。</figcaption></figure></li>
      <li data-cat="manga"><figure><div class="pic tall">漫画の<br>画像を置く場所</div><figcaption><span class="tag">漫画</span><strong>作品のタイトル</strong>ひとことの説明が入ります。</figcaption></figure></li>
      <li data-cat="illust"><figure><div class="pic">イラストの<br>画像を置く場所</div><figcaption><span class="tag">イラスト</span><strong>作品のタイトル</strong>ひとことの説明が入ります。</figcaption></figure></li>
      <li data-cat="yonkoma"><figure><div class="pic tall">4コマの<br>画像を置く場所</div><figcaption><span class="tag">4コマ</span><strong>作品のタイトル</strong>ひとことの説明が入ります。</figcaption></figure></li>
      <li data-cat="illust"><figure><div class="pic">イラストの<br>画像を置く場所</div><figcaption><span class="tag">イラスト</span><strong>作品のタイトル</strong>ひとことの説明が入ります。</figcaption></figure></li>
      <li data-cat="essay"><figure><div class="pic">記事の<br>サムネイルを置く場所</div><figcaption><span class="tag">記事</span><strong>記事のタイトル</strong>小論文形式の軽い記事の紹介文が入ります。</figcaption></figure></li>
    </ul>
    <p class="note">作品が増えたら、ページ分けや「新着」の表示も足せます。</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>© 2026 どうぶつ勉強ノート　／　<a href="about.html">このサイトについて</a></p>
  </div>
</footer>

<script>
(function(){
  var buttons=document.querySelectorAll('.filter button');
  var items=document.querySelectorAll('.grid li');
  buttons.forEach(function(b){
    b.addEventListener('click',function(){
      var cat=b.getAttribute('data-cat');
      buttons.forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
      items.forEach(function(li){
        li.hidden=!(cat==='all'||li.getAttribute('data-cat')===cat);
      });
    });
  });
})();
</script>
</body>
</html>
